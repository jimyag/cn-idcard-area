name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum:
    name: Minimum Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -mod=readonly ./...

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet -mod=readonly ./...
      - name: Test with race detector
        if: runner.os == 'Linux'
        run: go test -mod=readonly -race ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test -mod=readonly ./...
      - name: Build and run the command
        shell: bash
        run: |
          mkdir -p tmp/bin
          binary=tmp/bin/cn-idcard-area
          if [[ "$RUNNER_OS" == Windows ]]; then
            binary+=.exe
          fi
          CGO_ENABLED=0 go build -mod=readonly -trimpath -o "$binary" ./cmd/cn-idcard-area
          "$binary" 440305
